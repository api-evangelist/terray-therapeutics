aid: terray-therapeutics
name: Terray Therapeutics
description: 'Terray Therapeutics is an AI-native, chemistry-first biotechnology company
  building an integrated full-stack platform for small molecule drug discovery. Its
  EMMI platform (Experimentation Meets Machine Intelligence) pairs a proprietary ultra-miniaturized
  microarray assay system and fully automated lab with a family of machine learning
  models: COATI, a chemistry foundation model trained on roughly a billion molecules
  that encodes molecules into a latent space; reinforcement-learning generative models
  for synthesizable de novo design; TerraBind for potency prediction; and EMMI Select
  for uncertainty-aware molecule selection. Terray reports a proprietary target-molecule
  interaction dataset of more than 17 billion measurements growing by about a billion
  per quarter, and runs multi-target discovery collaborations with Bristol Myers Squibb,
  Gilead, Calico and Odyssey Therapeutics, with investment from NVIDIA. Terray publishes
  several of its research code libraries as open source on GitHub (COATI, COATI-LDM,
  TerraMax) but operates no public developer API, developer portal, or machine-readable
  API contract.'
